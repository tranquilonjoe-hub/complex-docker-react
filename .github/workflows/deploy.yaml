name: Deploy multi react

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Test Phase
      - run: docker build -t tranquilonjoedock/react-multi-test -f ./client/Dockerfile.dev ./client
      - run: docker run -e CI=true tranquilonjoedock/react-multi-test npm test

      # Build Phase
      - run: docker build -t tranquilonjoedock/multi-client ./client
      - run: docker build -t tranquilonjoedock/multi-nginx ./nginx
      - run: docker build -t tranquilonjoedock/multi-server ./server
      - run: docker build -t tranquilonjoedock/multi-worker ./worker

      # Push Phase
      - run: docker push tranquilonjoedock/multi-client
      - run: docker push tranquilonjoedock/multi-nginx
      - run: docker push tranquilonjoedock/multi-server
      - run: docker push tranquilonjoedock/multi-worker