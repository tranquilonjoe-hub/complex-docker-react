name: Deploy multi react

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Test Phase
      - run: docker build -t tranquilonjoedock/react-multi-test -f ./client/Dockerfile.dev ./client
      - run: docker run -e CI=true tranquilonjoedock/react-multi-test npm test

      # Build Phase
      - run: docker build -t tranquilonjoedock/multi-client ./client
      - run: docker build -t tranquilonjoedock/multi-nginx ./nginx
      - run: docker build -t tranquilonjoedock/multi-server ./server
      - run: docker build -t tranquilonjoedock/multi-worker ./worker

      # Push Phase
      - run: docker push tranquilonjoedock/multi-client
      - run: docker push tranquilonjoedock/multi-nginx
      - run: docker push tranquilonjoedock/multi-server
      - run: docker push tranquilonjoedock/multi-worker

      # Create the Zip File for AWS
      - name: Generate deployment package
        run: zip deploy.zip docker-compose.yml

      # Deploy Phase
      - name: Deploy to EB
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY }}
          aws_secret_key: ${{ secrets.AWS_SECRET_KEY }}
          application_name: Multi-Docker
          environment_name: Multi-Docker-env
          existing_bucket_name: elasticbeanstalk-us-west-2-955317918936
          region: us-west-2
          version_label: ${{ github.sha }}
          deployment_package: deploy.zip
          use_existing_version_if_available: "true"